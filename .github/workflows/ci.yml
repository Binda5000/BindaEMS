name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: uv sync --locked --extra core --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Typprüfung
        run: uv run mypy src
      - name: Importgrenzen
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest -q
