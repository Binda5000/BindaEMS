name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: uv sync --locked --extra core --extra app --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Typprüfung
        run: uv run mypy src
      - name: Importgrenzen
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest -q

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile
      - name: Lint und Format
        run: pnpm lint
      - name: Typprüfung
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Bauen
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: [python, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Python-Abhängigkeiten installieren
        run: uv sync --locked --extra core --extra app --extra dev
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: UI-Abhängigkeiten installieren
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Browser installieren
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium
      - name: UI bauen
        working-directory: ui
        run: pnpm build
      - name: End-to-End-Tests gegen das Demo-Backend
        working-directory: ui
        run: pnpm e2e
      - name: Bericht sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [python, ui]
    strategy:
      matrix:
        component: [core, app]
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck deploy/influxdb-setup.sh
      - name: Compose-Datei prüfen
        run: |
          cp deploy/config.example.yaml deploy/config.yaml
          touch deploy/.env
          docker compose -f deploy/docker-compose.yml config -q
      - uses: docker/setup-buildx-action@v3
      - name: Anmeldung bei GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/binda5000/bindaems-${{ matrix.component }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern=v{{version}}
      - name: Image bauen (und auf main/Tags veröffentlichen)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.component }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
