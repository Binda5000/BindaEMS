name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: uv sync --locked --extra core --extra app --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Typprüfung
        run: uv run mypy src
      - name: Importgrenzen
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: python
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck deploy/influxdb-setup.sh
      - name: Compose-Datei prüfen
        run: |
          cp deploy/config.example.yaml deploy/config.yaml
          touch deploy/.env
          docker compose -f deploy/docker-compose.yml config -q
      - uses: docker/setup-buildx-action@v3
      - name: Anmeldung bei GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/binda5000/bindaems-core
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern=v{{version}}
      - name: Image bauen (und auf main/Tags veröffentlichen)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.core
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
