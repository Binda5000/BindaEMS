[project]
name = "bindaems"
version = "0.1.0"
description = "Lokales Energiemanagementsystem für Hausakku, PV und Wallboxen"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
core = [
    "aiomqtt>=2.3",
    "pymodbus>=3.7",
    "httpx>=0.27",
    "websockets>=13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bindaems"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
# Deutsche Typografie in Nutzertexten und Docstrings ist gewollt.
allowed-confusables = ["–", "„", "“", "−", "×"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]

[tool.importlinter]
root_package = "bindaems"

[[tool.importlinter.contracts]]
name = "core importiert app nicht"
type = "forbidden"
source_modules = ["bindaems.core"]
forbidden_modules = ["bindaems.app"]

[[tool.importlinter.contracts]]
name = "app importiert core nicht"
type = "forbidden"
source_modules = ["bindaems.app"]
forbidden_modules = ["bindaems.core"]

[[tool.importlinter.contracts]]
name = "shared importiert weder core noch app"
type = "forbidden"
source_modules = ["bindaems.shared"]
forbidden_modules = ["bindaems.core", "bindaems.app"]
