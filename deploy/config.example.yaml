# Beispielkonfiguration für BindaEMS – Werte nur zur Illustration, an die eigene Anlage anpassen.
# Harte Grenzen stehen ausschließlich hier; UI, Home Assistant und Lernmodelle können sie nicht ändern.
# Secrets (Tokens, Passwörter) gehören in die .env-Datei, nicht hierher.

site:
  timezone: Europe/Vienna
  location: {lat: 48.20, lon: 16.37}

grid:
  phases: 3
  voltage_nominal_v: 230
  fuse_a: 35            # Hausanschlusssicherung je Phase in A
  fuse_margin_a: 2      # Sicherheitsabstand in A

battery:
  usable_kwh: 30
  reserve_soc_pct: 20   # USV-Reserve: harte Untergrenze für den Akku-SOC
  max_charge_w: 10000
  max_discharge_w: 12000

victron:
  mqtt:
    host: cerbo.lan
    port: 8883
    tls: true
    tls_verify: false   # der Cerbo nutzt ein selbstsigniertes Zertifikat
    # portal_id: c0619ab1234   # ohne Angabe wird die Portal-ID automatisch ermittelt
  modbus: {host: cerbo.lan, port: 502}
  instances:            # Werte laut Prüfprotokoll Teil 1 eintragen
    grid: 30
    vebus: 276
    battery: 512
    pv: {31: huawei}
    acload: {32: obergeschoss}
    # GX-Dienst der EVCS (Instanz → Schlüssel in wallboxes): Darüber schreibt der core ihren Strom,
    # und der Watchdog am Cerbo setzt den sicheren Strom. Pflicht, sobald die EVCS live_allowed hat.
    evcharger: {40: evcs}
  expected:
    hub4_mode: 1
    batterylife_states: [10, 11, 12]   # Optimiert ohne BatteryLife: normal, SOC unter Min-SOC, Nachladen
  max_grid_charge_setpoint_w: 8000
  persistent_writes: {per_hour: 12, per_day: 100}
  # Heartbeat an den Watchdog am Cerbo, solange der core regelt (docs/betrieb.md, Abschnitt 14).
  # Nach jeder Änderung die config.ini des Watchdogs neu erzeugen und mit install.sh übertragen.
  watchdog: {heartbeat_s: 10, timeout_s: 90}
  # Freigabe für den Live-Betrieb von Victron (Netz-Sollwert, Entladegrenze, Min-SOC), erst nach
  # bestandenem Prüfprotokoll Teil 2 (Spec 8.7). Mit true hebt der Watchdog bei einer Auslösung
  # auch den Netz-Sollwert-Override des EMS auf (config.ini neu erzeugen); ohne bleibt er
  # unberührt, denn dann nutzt Dynamic ESS den Override.
  live_allowed: false

wallboxes:
  evcs:
    type: victron_evcs_ns
    host: evcs.lan
    min_a: 6
    max_a: 16
    safe_a: 6                 # sicherer Strom: sicherer Zustand, Übergabe und Watchdog
    phase_map: [L1, L2, L3]   # Wallbox-Phase 1..3 → Netzphase
    # Freigabe für den Live-Betrieb dieser EVCS; verlangt ihren Eintrag unter
    # victron.instances.evcharger. Der core schreibt Strom und Laden, nie den Modus.
    live_allowed: false
  twc:
    type: tesla_wall_connector_gen3
    host: twc.lan
    max_a: 16
    phase_map: [L1, L2, L3]

vehicles:
  tesla:
    name: Tesla Model 3
    usable_kwh: 75
    phases: 3
    # Über Tessie wirkt ein Befehl auf oder von 5 A erst beim zweiten Mal; der Tesla-Aktor prüft das
    # im Tessie-Cache und wiederholt ihn dann einmal (Prüfprotokoll Teil 2 vom 12.10.2026).
    min_a: 5
    max_a: 16
    default_wallbox: twc
    live_allowed: false   # Freigabe für den Live-Betrieb; verlangt den Abschnitt tessie
    # Der Token steht als BINDAEMS_TESSIE_TOKEN in der .env. Ohne ihn wird der Tesla weder gelesen
    # noch gesteuert. Befehle gehen über Tessie; das Auto wird nie geweckt.
    tessie: {vin: 5YJ3E7EB0MF000000}
    # Befehlslimits für Tessie (Spec 6.5)
    commands: {current_interval_s: 90, current_step_a: 2, per_hour: 20, start_stop_per_hour: 6}
  egolf:
    name: e-Golf
    usable_kwh: 38.6
    phases: 2
    min_a: 6
    max_a: 16
    default_wallbox: evcs
    soc_entity: sensor.egolf_soc

pv:
  planes:
    - {name: Sued, kwp: 10, tilt_deg: 30, azimuth_deg: 0}   # Azimut: 0 = Süd, −90 = Ost, 90 = West
  inverter_ac_max_w: 10000

homeassistant:
  url: http://homeassistant.lan:8123
  entities:             # Signalname → entity_id
    vehicle.egolf.soc_pct: sensor.egolf_soc
  mqtt:                 # MQTT Discovery am bestehenden Mosquitto (eigener Benutzer bindaems)
    host: homeassistant.lan
    port: 1883
    username: bindaems

influxdb:
  url: http://influx.lan:8086
  database: bindaems
  username: bindaems
  ha_database: homeassistant   # wie `database:` in HAs InfluxDB-Konfiguration (HA-Standard: home_assistant)

telemetry:
  spool_dir: /data/spool
  spool_max_mb: 500
  spool_max_age_days: 7

core_api:
  host: 0.0.0.0
  port: 8081

app:
  port: 8080
  core_url: http://ems-core:8081
  trusted_proxies: [192.168.1.10]   # IP-Adresse des Reverse Proxy
  cookie_secure: true

# Freigabe einer Sperre nach so vielen Sekunden ohne Ursache (Spec 7.9). So lange besteht auch der
# Alarm nach einer fremden Änderung von EVCS-Strom, Override oder Tesla-Strom.
safety: {lock_release_s: 60}

# Ablage des core (Volume core-data): intent.json, write_budget.json, rate_limits.json und das
# Entscheidungslog decisions/ (Tagesdateien, höchstens 7 Tage und 50 MB).
core: {data_dir: /data}
