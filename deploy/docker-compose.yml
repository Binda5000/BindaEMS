# BindaEMS auf der VM: /opt/bindaems/{docker-compose.yml,config.yaml,.env}
# Start: docker compose up -d · Update: docker compose pull && docker compose up -d
name: bindaems

services:
  ems-core:
    image: ghcr.io/binda5000/bindaems-core:${BINDAEMS_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.core
    env_file: .env
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - core-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    # Veröffentlicht ist nur der CoE-Port der Klimaanlage (UDP 5442): Das C.M.I. sendet hierhin, der
    # core antwortet vom selben Port (docs/betrieb.md, „Klimaanlage (Phase 6a)“). Routing und
    # Firewall zwischen 192.168.81.0/24 und 192.168.82.0/24 sind Sache des Betreibers. Sonst keine
    # Ports; zur Diagnose kurzzeitig einkommentieren:
    #   - "127.0.0.1:8081:8081"
    ports:
      - "5442:5442/udp"
    networks:
      - internal

  ems-app:
    image: ghcr.io/binda5000/bindaems-app:${BINDAEMS_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    env_file: .env
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - app-data:/data
      - backup:/backup
    # Der Reverse Proxy läuft außerhalb dieser VM und leitet auf <vm>:8080 weiter; seine Adresse
    # steht in app.trusted_proxies. Läuft er als Container auf dieser VM, ersetzt ein gemeinsames
    # Docker-Netz die Portfreigabe (docs/betrieb.md).
    ports:
      - "8080:8080"
    networks:
      - internal
    depends_on:
      - ems-core
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  # Gemeinsames Netz für core und app. Bewusst kein „internal: true“:
  # der core braucht das LAN (Cerbo, Wallboxen, InfluxDB, HA) und das Internet (Tessie).
  internal: {}

volumes:
  core-data: {}
  app-data: {}
  backup: {}
